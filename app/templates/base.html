<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Automite AI — Intelligent Automation{% endblock %}</title>
    <meta name="description" content="{% block meta_description %}Automite AI builds intelligent AI voice agents that handle inbound calls, automate follow-ups, and work 24/7 so your team doesn't have to.{% endblock %}">
    <link rel="canonical" href="{% block canonical_url %}https://auto-mite.com/automiteaiapplication/automiteui/pages/landing{% endblock %}">
    <meta name="theme-color" content="#1A4D3A">
    {# Open Graph / Twitter — per-page overrides via blocks below #}
    <meta property="og:type" content="{% block og_type %}website{% endblock %}">
    <meta property="og:site_name" content="Automite AI">
    <meta property="og:title" content="{% block og_title %}Automite AI — Intelligent AI Voice Agents for Business{% endblock %}">
    <meta property="og:description" content="{% block og_description %}Automite AI builds intelligent AI voice agents that handle inbound calls, automate follow-ups, and work 24/7 so your team doesn't have to.{% endblock %}">
    <meta property="og:url" content="{% block og_url %}https://auto-mite.com/automiteaiapplication/automiteui/pages/landing{% endblock %}">
    <meta property="og:image" content="https://auto-mite.com/automiteaiapplication/automiteui/static/images/logo.png">
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:title" content="{% block twitter_title %}Automite AI — Intelligent AI Voice Agents for Business{% endblock %}">
    <meta name="twitter:description" content="{% block twitter_description %}Automite AI builds intelligent AI voice agents that handle inbound calls, automate follow-ups, and work 24/7 so your team doesn't have to.{% endblock %}">
    <meta name="twitter:image" content="https://auto-mite.com/automiteaiapplication/automiteui/static/images/logo.png">
    {% block meta_extra %}{% endblock %}
    <script type="application/ld+json">
    {% block json_ld %}{
      "@context": "https://schema.org",
      "@graph": [
        {
          "@type": "Organization",
          "@id": "https://auto-mite.com/#organization",
          "name": "Automite AI",
          "url": "https://auto-mite.com/",
          "logo": "https://auto-mite.com/automiteaiapplication/automiteui/static/images/logo.png",
          "email": "aiautomite@gmail.com",
          "telephone": "+1-705-315-0166",
          "sameAs": ["https://auto-mite.com/blogs"]
        },
        {
          "@type": "WebSite",
          "@id": "https://auto-mite.com/#website",
          "url": "https://auto-mite.com/",
          "name": "Automite AI",
          "publisher": {"@id": "https://auto-mite.com/#organization"}
        }
      ]
    }{% endblock %}
    </script>
    <link rel="icon" type="image/jpeg" href="/automiteaiapplication/automiteui/static/images/icon.jpeg">
    <link rel="stylesheet" href="/automiteaiapplication/automiteui/static/css/automite.css?v={{ static_hash('css/automite.css') }}">
    {% block head_extra %}{% endblock %}
</head>
<body>
    <!-- Full-page loader — hidden by JS once data is ready -->
    <div id="page-loader" role="status" aria-label="Loading">
        <div class="loader-brand">
            <img class="loader-logo" src="/automiteaiapplication/automiteui/static/images/logo.png" alt="Automite AI">
            <span class="loader-wordmark">Automite AI</span>
        </div>
        <div class="loader-wave" aria-hidden="true">
            <div class="loader-wave-bar"></div>
            <div class="loader-wave-bar"></div>
            <div class="loader-wave-bar"></div>
            <div class="loader-wave-bar"></div>
            <div class="loader-wave-bar"></div>
            <div class="loader-wave-bar"></div>
            <div class="loader-wave-bar"></div>
            <div class="loader-wave-bar"></div>
            <div class="loader-wave-bar"></div>
        </div>
    </div>

    <!-- Full-screen tint overlay — JS applies .tint-warning / .tint-critical / .tint-deactivated -->
    <div id="page-tint" aria-hidden="true"></div>

    {% block navbar %}{% endblock %}

    <main class="{% block main_class %}main-content{% endblock %}">
        {% block content %}{% endblock %}
    </main>

    <script src="/automiteaiapplication/automiteui/static/js/app.js?v={{ static_hash('js/app.js') }}"></script>
    {% block scripts %}{% endblock %}
</body>
</html>
